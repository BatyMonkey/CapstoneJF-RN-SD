<ion-app>

  <!-- 🔐 Zona de autenticación: login, register, recuperar contraseña, callback, etc -->
  <ion-router-outlet *ngIf="isAuth"></ion-router-outlet>

  <!-- 🌐 Layout principal: solo cuando NO estamos en /auth/... -->
  <ng-container *ngIf="!isAuth">

    <!-- Menú lateral -->
    <ion-menu contentId="main" menuId="main-menu" side="start">
      <ion-header>
        <ion-toolbar color="light">
          <ion-title>Menú</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-item routerLink="/home" routerDirection="root">Inicio</ion-item>
          <ion-item routerLink="/noticias" routerDirection="root">Noticias</ion-item>
          <ion-item routerLink="/votaciones" routerDirection="root">Votar</ion-item>
          <ion-item routerLink="/perfil" routerDirection="root">Perfil</ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- Contenedor principal -->
    <ion-router-outlet id="main"></ion-router-outlet>

    <!-- Barra inferior fija -->
    <ion-footer class="rb-footer-fixed">
      <ion-toolbar class="rb-tabbar">
        <div class="rb-tabbar__row">
          <!-- Inicio -->
          <ion-button
            fill="clear"
            routerLink="/home"
            routerDirection="root"
            routerLinkActive="rb-active"
          >
            <ion-icon name="home-outline"></ion-icon>
          </ion-button>

          <!-- Actividades -->
          <ion-button
            fill="clear"
            routerLink="/inscripcion/actividades"
            routerDirection="root"
            routerLinkActive="rb-active"
          >
            <ion-icon name="bicycle-outline"></ion-icon>
          </ion-button>

          <!-- Noticias -->
          <ion-button
            fill="clear"
            routerLink="/noticias"
            routerDirection="root"
            routerLinkActive="rb-active"
          >
            <ion-icon name="calendar-outline"></ion-icon>
          </ion-button>

          <!-- Admin (solo si es administrador) -->
          <ion-button
            *ngIf="isAdmin"
            fill="clear"
            routerLink="/admin/gestiones"
            routerDirection="root"
            routerLinkActive="rb-active"
          >
            <ion-icon name="shield-checkmark-outline"></ion-icon>
          </ion-button>

          <!-- Perfil (solo icono) -->
          <ion-button
            fill="clear"
            routerLink="/perfil"
            routerDirection="root"
            routerLinkActive="rb-active"
          >
            <ion-icon name="person-circle-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-toolbar>
    </ion-footer>

    <!-- Botón flotante IA (brillito celeste) -->
    <button class="ai-fab" (click)="toggleChatbot()">
      <ion-icon name="sparkles-outline"></ion-icon>
    </button>

    <!-- Chatbot solo cuando está visible -->
    <app-chatbot *ngIf="showChatbot"></app-chatbot>

  </ng-container>
</ion-app>
