<!-- src/app/components/chatbot.component.html -->

<div class="rb-chat">
  <!-- HEADER -->
  <div class="rb-chat__header">
    <div class="rb-chat__avatar">
      <ion-icon name="sparkles-outline"></ion-icon>
      <span class="rb-chat__avatar-fallback">🤖</span>
    </div>
    <div class="rb-chat__title">
      <h2>RedBarrio</h2>
      <p>Hola vecino/a 👋</p>
    </div>

    <!-- BOTÓN CERRAR -->
    <button
      type="button"
      class="rb-chat__close"
      aria-label="Cerrar chat"
      (click)="closeChat()"
    >
      <ion-icon name="close-outline"></ion-icon>
      <span class="rb-chat__close-fallback">×</span>
    </button>
  </div>

  <!-- QUICK ACTIONS -->
  <div class="rb-chat__quick">
    <button (click)="clickQuick('faq')">
      <ion-icon name="help-circle-outline"></ion-icon>
      Preguntas frecuentes
    </button>
    <button (click)="clickQuick('cert')">
      <ion-icon name="document-text-outline"></ion-icon>
      Certificados
    </button>
    <button (click)="clickQuick('votacion')">
      <ion-icon name="checkbox-outline"></ion-icon>
      Votaciones
    </button>
    <button (click)="clickQuick('noticias')">
      <ion-icon name="newspaper-outline"></ion-icon>
      Noticias
    </button>
  </div>

  <!-- MENSAJES -->
  <div class="rb-chat__messages">
    <div
      *ngFor="let m of messages"
      [ngClass]="{
        'msg': true,
        'msg--bot': m.from === 'bot',
        'msg--user': m.from === 'user'
      }"
    >
      <div class="msg__bubble" [innerHTML]="m.text"></div>
      <div class="msg__time">{{ m.at | date:'shortTime' }}</div>
    </div>

    <div class="rb-chat__loading" *ngIf="loading">
      <ion-spinner name="dots"></ion-spinner>
      <span>Escribiendo…</span>
    </div>
  </div>

  <!-- INPUT -->
  <form class="rb-chat__input" (ngSubmit)="send()">
    <input
      type="text"
      [(ngModel)]="inputText"
      name="chatInput"
      placeholder="Escribe un mensaje..."
      [disabled]="loading"
      autocomplete="off"
    />

    <!-- Botón nota de voz (a la derecha, junto al enviar) -->
        <!-- Botón nota de voz (a la derecha, junto al enviar) -->
    <button
      type="button"
      class="rb-chat__voice"
      [class.is-recording]="isRecording"
      [disabled]="loading || !canUseVoice"
      (click)="toggleVoice()"
      aria-label="Nota de voz"
    >
      <!-- Icono cuando NO está grabando -->
      <ion-icon
        *ngIf="!isRecording"
        name="mic"
      ></ion-icon>

      <!-- Icono cuando SÍ está grabando -->
      <ion-icon
        *ngIf="isRecording"
        name="square"
      ></ion-icon>
    </button>


    <button
      type="submit"
      class="rb-chat__send"
      [disabled]="loading || !inputText.trim()"
    >
      <ion-icon name="paper-plane-outline"></ion-icon>
      <span class="rb-chat__send-fallback">➤</span>
    </button>
  </form>
</div>
